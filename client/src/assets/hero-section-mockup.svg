<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Hero Background Gradient -->
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#heroGrad)"/>
  
  <!-- Floating Party Elements -->
  <text x="80" y="80" font-size="40" fill="white">🎈</text>
  <text x="680" y="120" font-size="30" fill="white">⭐</text>
  <text x="120" y="420" font-size="35" fill="white">🎂</text>
  <text x="720" y="380" font-size="25" fill="white">🎊</text>
  
  <!-- Badge -->
  <rect x="250" y="80" width="300" height="40" rx="20" fill="white" fill-opacity="0.2" stroke="white" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">✨ Hampton's Premier Party Planners ✨</text>
  
  <!-- Main Headline -->
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white">The Most</text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#FDE047">Magical</text>
  <text x="400" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white">Kids Parties</text>
  <text x="400" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white">In Hampton!</text>
  
  <!-- Subheadline -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9">Transform your child's special day into an unforgettable adventure</text>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9">with our themed party experiences.</text>
  
  <!-- CTA Buttons -->
  <rect x="200" y="380" width="180" height="50" rx="25" fill="#FDE047"/>
  <text x="290" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="black">Book Your Magic Party 🎉</text>
  
  <rect x="420" y="380" width="180" height="50" rx="25" fill="transparent" stroke="white" stroke-width="2"/>
  <text x="510" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">See Our Themes</text>
</svg>