<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="proofBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#proofBack)"/>
  
  <!-- Section Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F2937">Happy Parents,</text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#EA580C">Magical Memories</text>
  
  <!-- Testimonial Cards -->
  <!-- Card 1 -->
  <rect x="50" y="100" width="200" height="150" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <!-- 5 Stars -->
  <text x="60" y="125" font-family="Arial, sans-serif" font-size="12" fill="#FBBF24">★★★★★</text>
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="11" fill="#374151">"Host Hampton made my</text>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="11" fill="#374151">daughter's princess party</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="11" fill="#374151">absolutely magical!</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">Every detail was perfect."</text>
  <text x="60" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F2937">- Sarah M.</text>
  
  <!-- Card 2 -->
  <rect x="300" y="100" width="200" height="150" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <!-- 5 Stars -->
  <text x="310" y="125" font-family="Arial, sans-serif" font-size="12" fill="#FBBF24">★★★★★</text>
  <text x="310" y="150" font-family="Arial, sans-serif" font-size="11" fill="#374151">"The superhero party was</text>
  <text x="310" y="165" font-family="Arial, sans-serif" font-size="11" fill="#374151">incredible. My son felt</text>
  <text x="310" y="180" font-family="Arial, sans-serif" font-size="11" fill="#374151">like a real hero for</text>
  <text x="310" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">the day!"</text>
  <text x="310" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F2937">- Mike R.</text>
  
  <!-- Card 3 -->
  <rect x="550" y="100" width="200" height="150" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <!-- 5 Stars -->
  <text x="560" y="125" font-family="Arial, sans-serif" font-size="12" fill="#FBBF24">★★★★★</text>
  <text x="560" y="150" font-family="Arial, sans-serif" font-size="11" fill="#374151">"Professional, creative,</text>
  <text x="560" y="165" font-family="Arial, sans-serif" font-size="11" fill="#374151">and so much fun.</text>
  <text x="560" y="180" font-family="Arial, sans-serif" font-size="11" fill="#374151">Will definitely book</text>
  <text x="560" y="195" font-family="Arial, sans-serif" font-size="11" fill="#374151">again!"</text>
  <text x="560" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1F2937">- Jennifer L.</text>
</svg>