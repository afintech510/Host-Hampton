<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#FFFFFF"/>
  
  <!-- Section Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937">Why Host Hampton Makes Parties</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#9333EA">Extraordinary</text>
  
  <!-- Benefit Cards -->
  <!-- Card 1 - Stress-Free Planning -->
  <rect x="50" y="130" width="200" height="220" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="150" cy="180" r="30" fill="url(#benefitGrad1)"/>
  <text x="150" y="185" text-anchor="middle" font-size="20" fill="white">🕐</text>
  <text x="150" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Stress-Free Planning</text>
  <text x="150" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">We handle all the details</text>
  <text x="150" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">so you can focus on</text>
  <text x="150" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">celebrating</text>
  
  <!-- Card 2 - Magical Experiences -->
  <rect x="300" y="130" width="200" height="220" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="400" cy="180" r="30" fill="url(#benefitGrad2)"/>
  <text x="400" y="185" text-anchor="middle" font-size="20" fill="white">✨</text>
  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Magical Experiences</text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Immersive themed</text>
  <text x="400" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">decorations and activities</text>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">that wow kids</text>
  
  <!-- Card 3 - Unforgettable Memories -->
  <rect x="550" y="130" width="200" height="220" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="650" cy="180" r="30" fill="url(#benefitGrad3)"/>
  <text x="650" y="185" text-anchor="middle" font-size="20" fill="white">💖</text>
  <text x="650" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">Unforgettable Memories</text>
  <text x="650" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Professional photos and</text>
  <text x="650" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">moments your family will</text>
  <text x="650" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">treasure forever</text>
  
  <!-- Gradients for icons -->
  <defs>
    <linearGradient id="benefitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="benefitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="benefitGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>